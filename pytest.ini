# pytest configuration. From the repo root:
#
#   uvx pytest
#
# The tests need only the stdlib and pytest (each adds src/ to sys.path
# itself), so pytest runs from uv's tool cache. Use this form everywhere
# (docstrings, READMEs, scripts) so there is one way to run the suite.
#
# pytest.ini rather than pyproject.toml: this repo runs everything with
# `uv run --no-project`, and a pyproject.toml would start making it a uv
# project -- a bigger change than configuring one tool.
[pytest]
testpaths = tests
