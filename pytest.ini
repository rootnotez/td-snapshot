# pytest configuration. From the repo root:
#
#   uv run --no-project --with pytest pytest
#
# pytest.ini rather than pyproject.toml: this repo runs everything with
# `uv run --no-project`, and a pyproject.toml would start making it a uv
# project -- a bigger change than configuring one tool.
[pytest]
testpaths = tests

# Setting norecursedirs replaces pytest's defaults, so they are repeated
# here, then `runs`: tests/toolchain/runs/ holds gitignored toolchain
# regression output that grows to millions of files (10 GB / ~2.3M files on
# the dev machine, 2026-09-27). Crawling it for test files made collection
# take ~3.5 minutes instead of under a second.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} __pycache__ runs
